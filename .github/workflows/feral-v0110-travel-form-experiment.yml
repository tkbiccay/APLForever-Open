name: Feral v0.11.0 — Travel Form fallback experiment

on:
  pull_request:
    paths:
      - ".github/workflows/feral-v0110-travel-form-experiment.yml"
      - "experiments/native/aplforever_feral_travel_form_v011_spec.lua"
      - "roles/Druid/Archive/APL_Druid_Feral_v1.3_Draft.txt"
      - "roles/Druid/Archive/APL_Druid_Feral_DPS_v1.0_Draft.txt"
      - "catalogue/roles.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  feral-travel-source:
    name: v0.11 source-native Travel Form source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact APLForever head
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout published Hekili Forever v0.11.0
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify upstream commit and protected APL catalogue hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap exact released Lua engine
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare shipped, protected Feral v1.3 and test-only alternative
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_travel_form_v011_spec.lua" tests/Forever/aplforever_feral_travel_form_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_feral_travel_form_v011_spec.lua
