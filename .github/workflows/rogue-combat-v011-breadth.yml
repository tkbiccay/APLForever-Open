name: Rogue Combat v0.11 native Energy and fallback
on:
  pull_request:
    paths:
      - ".github/workflows/rogue-combat-v011-breadth.yml"
      - "experiments/native/aplforever_rogue_combat_energy_v011_spec.lua"
      - "docs/knowledge/ROLE_COVERAGE.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-rogue-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source and immutable APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap native source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare complete Rogue Combat shipped and Current
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_rogue_combat_energy_v011_spec.lua" tests/Forever/aplforever_rogue_combat_energy_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_rogue_combat_energy_v011_spec.lua
