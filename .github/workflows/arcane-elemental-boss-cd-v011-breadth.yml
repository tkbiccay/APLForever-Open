name: Multi-role Arcane Elemental Boss Cooldowns v0.11 breadth
on:
  pull_request:
    paths:
      - ".github/workflows/arcane-elemental-boss-cd-v011-breadth.yml"
      - "experiments/native/aplforever_arcane_elemental_boss_cd_v011_spec.lua"
      - "roles/Mage/Current/APL_Mage_Arcane_v1.0_Draft.txt"
      - "roles/Shaman/Current/APL_Shaman_Elemental_v1.0_Draft.txt"
      - "docs/Tests_Breadth_BossCooldowns_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published source and preserved repository APL catalogue
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap released native source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Exercise four complete released profiles per matched role/seed/Mana scenario
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_arcane_elemental_boss_cd_v011_spec.lua" tests/Forever/aplforever_arcane_elemental_boss_cd_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_arcane_elemental_boss_cd_v011_spec.lua
