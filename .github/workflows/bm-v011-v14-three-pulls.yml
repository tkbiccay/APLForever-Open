name: Hunter BM v0.11 v1.4 three-pull reset
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v011-v14-three-pulls.yml"
      - "experiments/native/aplforever_bm_v14_three_pulls_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pinned source and protected catalogue
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published source-native Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Six matched complete-profile same-boot three-fight regressions
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_v14_three_pulls_spec.lua" tests/Forever/aplforever_bm_v14_three_pulls_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_v14_three_pulls_spec.lua
