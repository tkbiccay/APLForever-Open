name: Hunter BM v0.11 native Major off-switch and fallback
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v011-major-offswitch.yml"
      - "experiments/native/aplforever_bm_major_offswitch_v011_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published source and protected APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap source-native Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare complete shipped Current and v1.4 with native Major ON and OFF
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_major_offswitch_v011_spec.lua" tests/Forever/aplforever_bm_major_offswitch_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_major_offswitch_v011_spec.lua
