name: "Breadth #14-15 Fire Combustion and BM Rapid Fire v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/fire-bm-cooldown-v011-breadth.yml"
      - "experiments/native/aplforever_fire_bm_cooldown_v011_spec.lua"
      - "docs/Tests_Breadth_FireBM_Cooldowns_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
      - "roles/Mage/Current/APL_Mage_Fire_v1.0_Draft.txt"
      - "roles/Mage/Candidates/APL_Mage_Fire_v1.1_Draft.txt"
      - "catalogue/roles.json"
      - "Catalogue_All_Roles.md"
      - "roles/Hunter/Current/APL_Hunter_BeastMastery_v1.1_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.4_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact released source and all protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap current released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Diagnose the reproduced Fire Scorch true-Mana refusal before wider matrix
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_fire_bm_cooldown_v011_spec.lua" tests/Forever/aplforever_fire_bm_cooldown_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose --filter='Fire seed30417' tests/Forever/aplforever_fire_bm_cooldown_v011_spec.lua
      - name: Execute Fire and BM independent CD source-native whole-profile loops
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_fire_bm_cooldown_v011_spec.lua" tests/Forever/aplforever_fire_bm_cooldown_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_fire_bm_cooldown_v011_spec.lua
