name: Paladin v0.11 Holy Shield autonomy experiment
on:
  pull_request:
    paths:
      - ".github/workflows/paladin-v011-holy-shield-toggle.yml"
      - "experiments/native/aplforever_paladin_holy_shield_toggle_v011_spec.lua"
      - "roles/Paladin/Current/APL_Paladin_Protection_Tank_v1.0_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paladin-holy-shield:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pin and immutable catalogue
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap published source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run real source-world Holy Shield comparison
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_paladin_holy_shield_toggle_v011_spec.lua" tests/Forever/aplforever_paladin_holy_shield_toggle_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_paladin_holy_shield_toggle_v011_spec.lua
