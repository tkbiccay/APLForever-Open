name: Warrior Arms v0.10.0 precombat health phase investigation

# This workflow is source-native and narrow. It must NOT turn known Feral
# hidden-health errors into a green 23-role compatibility verdict.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/arms-precombat-v010-experiment.yml"
      - "experiments/native/aplforever_arms_precombat_phase_v010_spec.lua"
      - "experiments/native/aplforever_druid_role_tanking_v010_spec.lua"
permissions:
  contents: read
concurrency:
  group: arms-precombat-v010-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native-arms-precombat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed public APLForever branch
        uses: actions/checkout@v4
        with:
          path: aplforever
          persist-credentials: false
      - name: Checkout exact published Hekili Forever v0.10.0 source
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 3c2cf3e32472cc807b1ba29d992fc13a273da8ee
          path: upstream/hekili
          persist-credentials: false
      - name: Verify immutable original APLs and source commit
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "3c2cf3e32472cc807b1ba29d992fc13a273da8ee"
          cd aplforever
          python scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/aplforever" >> "$GITHUB_ENV"
      - name: Bootstrap published v0.10.0 Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Check actual upstream phase and health observability canaries
        working-directory: upstream/hekili
        run: |
          .lua/bin/busted --verbose tests/Forever/health_read_spec.lua tests/Forever/precombat_calls_spec.lua
      - name: Check intact imported Arms priority and exact phase-scoped warning
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/aplforever/experiments/native/aplforever_arms_precombat_phase_v010_spec.lua" tests/Forever/aplforever_arms_precombat_phase_v010_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_arms_precombat_phase_v010_spec.lua
      - name: Verify Feral and Guardian selected specs do not override client role
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/aplforever/experiments/native/aplforever_druid_role_tanking_v010_spec.lua" tests/Forever/aplforever_druid_role_tanking_v010_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_druid_role_tanking_v010_spec.lua
