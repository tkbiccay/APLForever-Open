name: "Forever v0.12.1 — strict manifest import and health guard review"
on:
  pull_request:
    paths:
      - ".github/workflows/forever-v0121-import.yml"
      - "experiments/native/aplforever_allroles_import_v0121_spec.lua"
      - "scripts/build_native_manifest.py"
      - "scripts/validate_repository.py"
      - "catalogue/roles.json"
      - "roles/**"
      - "docs/Tests_Compatibility_v0121_Import.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pin and all protected hashes; generate test manifest
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
          python project/scripts/build_native_manifest.py --source-release v0.12.1 --output "$RUNNER_TEMP/aplforever-native-manifest.lua"
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
          echo "APLFOREVER_NATIVE_MANIFEST=$RUNNER_TEMP/aplforever-native-manifest.lua" >> "$GITHUB_ENV"
          echo "APLFOREVER_SOURCE_RELEASE=v0.12.1" >> "$GITHUB_ENV"
      - name: Bootstrap exact published engine
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Strict per-revision import compile and guard diagnostics
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_allroles_import_v0121_spec.lua" tests/Forever/aplforever_allroles_import_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_allroles_import_v0121_spec.lua
