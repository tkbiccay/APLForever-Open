name: Guardian v0.11 — 9–60 unlock and fallback source-native

on:
  pull_request:
    paths:
      - ".github/workflows/guardian-v011-unlock-fallback.yml"
      - "experiments/native/aplforever_guardian_unlock_v011_spec.lua"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.5_Draft.txt"
      - "roles/Druid/Current/APL_Druid_Guardian_Tank_v1.0_ReportedWorking.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardian-unlocks:
    name: v0.11 real-source P0 Guardian 9/10/20/31/34/60
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact APLForever source
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout exact released Forever v0.11 source
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source and all protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap exact released Lua source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Validate six genuine level-bound source worlds and complete final fallback
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_guardian_unlock_v011_spec.lua" tests/Forever/aplforever_guardian_unlock_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_unlock_v011_spec.lua
