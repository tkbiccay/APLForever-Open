name: Paladin Retribution v0.11 native Seal Mana and fallback breadth
on:
  pull_request:
    paths:
      - ".github/workflows/paladin-ret-v011-breadth.yml"
      - "experiments/native/aplforever_paladin_ret_seal_mana_v011_spec.lua"
      - "docs/Tests_Paladin_Retribution_Breadth_v011.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source and immutable APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published source runtime
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run full Retribution Seal, Mana and fallback world scenarios
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_paladin_ret_seal_mana_v011_spec.lua" tests/Forever/aplforever_paladin_ret_seal_mana_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_paladin_ret_seal_mana_v011_spec.lua
