name: "Breadth #37 Shadow v0.12.1 Inner Focus upkeep"
on:
  pull_request:
    paths:
      - ".github/workflows/shadow-focus-v0121-breadth.yml"
      - "experiments/native/aplforever_shadow_focus_v0121_spec.lua"
      - "roles/Priest/Current/APL_Priest_Shadow_v1.0_Draft.txt"
      - "docs/Tests_Breadth_Shadow_Focus_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pin and repository
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare full native Shadow profiles
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_shadow_focus_v0121_spec.lua" tests/Forever/aplforever_shadow_focus_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_shadow_focus_v0121_spec.lua
