name: Feral DPS v0.11.0 — focused source-native candidate
on:
  pull_request:
    paths:
      - ".github/workflows/feral-v0110-aggro-native.yml"
      - "roles/Druid/Candidates/APL_Druid_Feral_v1.3_Draft.txt"
      - "experiments/native/aplforever_feral_aggro_defensive_v010_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: feral-v0110-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native-feral:
    name: v0.11.0 source-native Feral v1.3 aggro and GCD safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact APLForever branch
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout published Hekili Forever v0.11.0
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source pin and full catalogue hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap released Lua engine
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Imported v1.2 versus v1.3 positive and negative threat/defensive/fallback controls
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_aggro_defensive_v010_spec.lua" tests/Forever/aplforever_feral_aggro_defensive_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_feral_aggro_defensive_v011_spec.lua
