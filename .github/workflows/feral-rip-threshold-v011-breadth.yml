name: "Breadth #30 Feral Rip combo threshold and targeting v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/feral-rip-threshold-v011-breadth.yml"
      - "experiments/native/aplforever_feral_rip_threshold_v011_spec.lua"
      - "roles/Druid/Archive/APL_Druid_Feral_DPS_v1.0_Draft.txt"
      - "roles/Druid/Archive/APL_Druid_Feral_v1.4_Draft.txt"
      - "docs/Tests_Breadth_Feral_Rip_Threshold_v011.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source pin and immutable APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap pinned native world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare real Rip spend and targeting proxy
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_rip_threshold_v011_spec.lua" tests/Forever/aplforever_feral_rip_threshold_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_feral_rip_threshold_v011_spec.lua
