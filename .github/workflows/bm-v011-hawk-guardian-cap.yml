name: BM v0.11 — Hawk guardian belief cap and repeated casts
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v011-hawk-guardian-cap.yml"
      - "experiments/native/aplforever_bm_hawk_cap_v011_spec.lua"
      - "roles/Hunter/Current/APL_Hunter_BeastMastery_v1.1_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.4_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bm-hawk-cap:
    name: Exact v0.11 Hawk count cap2 expiry 18s source casts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact public PR
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout exact released Hekili Forever
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Assert published source and all 45 protected APL revisions
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap source-native runtime
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare modelled Hawk expiries and real cast chronology
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_hawk_cap_v011_spec.lua" tests/Forever/aplforever_bm_hawk_cap_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_bm_hawk_cap_v011_spec.lua
