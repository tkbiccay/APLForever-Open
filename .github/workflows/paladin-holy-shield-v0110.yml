name: Protection Paladin v0.11.0 native Holy Shield autonomy
on:
  pull_request:
    paths:
      - ".github/workflows/paladin-holy-shield-v0110.yml"
      - "experiments/native/aplforever_paladin_holy_shield_v011_spec.lua"
      - "roles/Paladin/Candidates/APL_Paladin_Protection_v1.1_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paladin-hs-v0110-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Source pin and protected APL hash integrity
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published source runtime
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full APL comparisons, accepted casts, source aura, toggles and negative controls
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_paladin_holy_shield_v011_spec.lua" tests/Forever/aplforever_paladin_holy_shield_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_paladin_holy_shield_v011_spec.lua
