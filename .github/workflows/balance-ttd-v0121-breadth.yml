name: "Breadth #33 Balance v0.12.1 Insect Swarm time-to-die"
on:
  pull_request:
    paths:
      - ".github/workflows/balance-ttd-v0121-breadth.yml"
      - "experiments/native/aplforever_balance_ttd_v0121_spec.lua"
      - "roles/Druid/Current/APL_Druid_Balance_DPS_v1.0_Draft.txt"
      - "docs/Tests_Breadth_Balance_TTD_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ttd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source and all immutable APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full profiles using actual native TTD estimator
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_balance_ttd_v0121_spec.lua" tests/Forever/aplforever_balance_ttd_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_balance_ttd_v0121_spec.lua
