name: Forever v0.11.0 — Guardian and BM source-native compatibility

# Source-native P0 subset only. Check out the current public repository's
# catalogue-protected standalone candidates, not ephemeral historical PR heads.
# No pet arrival, real client threat, DPS/TPS or all-role approval claims.
on:
  pull_request:
    paths:
      - ".github/workflows/v0110-p0-native.yml"
      - "docs/knowledge/engine/current-release.json"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.5_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.2_Draft.txt"
      - "experiments/native/aplforever_guardian_aggro_gate_v010_spec.lua"
      - "experiments/native/aplforever_bm_pet_reaction_v010_spec.lua"
      - "experiments/native/aplforever_bm_hha_v010_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forever-v0110-p0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native-p0:
    name: v0.11.0 complete Guardian v1.5 and Hunter BM v1.1/v1.2
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out exact tested public APLForever branch
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Check out published Forever v0.11.0 source
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact source and immutable catalogue-backed APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          test -f project/roles/Druid/Candidates/APL_Druid_Guardian_v1.5_Draft.txt
          test -f project/roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.2_Draft.txt
      - name: Bootstrap exact v0.11.0 released Lua source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Guardian complete imported v1.5, client role, aggro, and three accepted post-Roar actions
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_guardian_aggro_gate_v010_spec.lua" tests/Forever/aplforever_guardian_aggro_gate_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_guardian_aggro_gate_v011_spec.lua
      - name: Hunter BM complete imported v1.1/v1.2 client pet states and recovery fallback
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_pet_reaction_v010_spec.lua" tests/Forever/aplforever_bm_pet_reaction_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_pet_reaction_v011_spec.lua
      - name: Hunter BM source-window HHA range-aware negative and positive controls
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_hha_v010_spec.lua" tests/Forever/aplforever_bm_hha_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_hha_v011_spec.lua
