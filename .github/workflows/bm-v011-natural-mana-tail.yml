name: Hunter BM v0.11 — natural Mana and final fallback
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v011-natural-mana-tail.yml"
      - "experiments/native/aplforever_bm_v011_natural_tail_spec.lua"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.1_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.4_Draft.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tail:
    name: v0.11 shipped vs Current v1.1 vs BM v1.4 true Mana
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact public branch
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout immutable Hekili Forever v0.11.0
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source and full protected catalogue
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap v0.11 published Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Three genuine event-advanced low-Mana observations and no repeated ready refused icon
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_v011_natural_tail_spec.lua" tests/Forever/aplforever_bm_v011_natural_tail_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_bm_v011_natural_tail_spec.lua
