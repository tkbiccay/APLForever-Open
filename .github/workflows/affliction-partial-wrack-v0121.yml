name: "Breadth #41 Affliction v0.12.1 partial-upkeep Wrack"
on:
  pull_request:
    paths:
      - ".github/workflows/affliction-partial-wrack-v0121.yml"
      - "experiments/native/aplforever_affliction_partial_wrack_v0121_spec.lua"
      - "roles/Warlock/Current/APL_Warlock_Affliction_DPS_v1.0_Draft.txt"
      - "docs/Tests_Breadth_Affliction_Partial_Wrack_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-affliction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source and immutable APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare full native profiles and actual periodic effects
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_affliction_partial_wrack_v0121_spec.lua" tests/Forever/aplforever_affliction_partial_wrack_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_affliction_partial_wrack_v0121_spec.lua
