name: "Breadth #40 Guardian v0.12.1 solo Prowl exception"
on:
  pull_request:
    paths:
      - ".github/workflows/guardian-stealth-v0121.yml"
      - "experiments/native/aplforever_guardian_stealth_v0121_spec.lua"
      - "experiments/native/aplforever_guardian_stealth_cast_v0121_spec.lua"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.6_Draft.txt"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.7_Draft.txt"
      - "roles/Druid/Current/APL_Druid_Feral_v1.6_Draft.txt"
      - "docs/Tests_Breadth_Guardian_Stealth_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-guardian-stealth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source and all protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full tank profiles and observed manual stealth
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_guardian_stealth_v0121_spec.lua" tests/Forever/aplforever_guardian_stealth_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_stealth_v0121_spec.lua
      - name: Controlled native opener to paid Bear transition
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_guardian_stealth_cast_v0121_spec.lua" tests/Forever/aplforever_guardian_stealth_cast_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_stealth_cast_v0121_spec.lua
