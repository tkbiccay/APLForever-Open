name: Validate public repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public governance and catalogue hashes
        run: python scripts/check_public_repository.py
      - name: Python repository tests
        run: python -m unittest discover -s tests -v
      - name: Canonical repository validator when catalogue imported
        shell: bash
        run: |
          if [ -f scripts/validate_repository.py ]; then
            python scripts/validate_repository.py
          else
            echo "::notice::Bootstrap only: legacy validator and role catalogue have not been imported."
          fi
      - name: Audit immutable APLs for newly introduced secret/fixed state
        run: python scripts/audit_apl_observability.py --check --report "$RUNNER_TEMP/headless-matrix.md"
      - name: Attach per-role static and source-evidence matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-role-headless-evidence
          path: ${{ runner.temp }}/headless-matrix.md
          if-no-files-found: warn
          retention-days: 14
      - name: Public source-native compatibility scope
        run: |
          echo "Bootstrap CI is NOT a Hekili engine import, source-native regression or gameplay approval."
          echo "A pinned current-release native lane must be added and run after vetted APL import."
