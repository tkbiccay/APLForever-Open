name: "Breadth #16-17 Paladin Block and Warrior zero Rage v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/protection-mitigation-zero-rage-v011-breadth.yml"
      - "experiments/native/aplforever_protection_mitigation_zero_rage_v011_spec.lua"
      - "roles/Paladin/Current/APL_Paladin_Protection_Tank_v1.0_Draft.txt"
      - "roles/Paladin/Candidates/APL_Paladin_Protection_v1.1_Draft.txt"
      - "roles/Warrior/Current/APL_Warrior_Protection_Tank_v1.0_PendingInGame.txt"
      - "roles/Warrior/Candidates/APL_Warrior_Protection_v1.1_Draft.txt"
      - "docs/Tests_Breadth_Protection_Mitigation_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published release source and all SHA-pinned APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap exact source-native combat world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test actual block-charge and zero-Rage final fallback with full comparators
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_protection_mitigation_zero_rage_v011_spec.lua" tests/Forever/aplforever_protection_mitigation_zero_rage_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_protection_mitigation_zero_rage_v011_spec.lua
