name: Guardian v0.11.0 natural-Rage Maul list-order hypothesis
on:
  pull_request:
    paths:
      - ".github/workflows/guardian-maul-order-v0110.yml"
      - "experiments/native/aplforever_guardian_maul_order_v011_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-maul-v0110-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact source release and protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published Forever Lua world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare original/reordered Guardian v1.5 with 2–6 natural attackers
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_guardian_maul_order_v011_spec.lua" tests/Forever/aplforever_guardian_maul_order_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_guardian_maul_order_v011_spec.lua
