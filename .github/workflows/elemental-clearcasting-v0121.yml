name: "Breadth #39 Elemental v0.12.1 free Chain Lightning"
on:
  pull_request:
    paths:
      - ".github/workflows/elemental-clearcasting-v0121.yml"
      - "experiments/native/aplforever_elemental_clearcasting_v0121_spec.lua"
      - "roles/Shaman/Current/APL_Shaman_Elemental_v1.0_Draft.txt"
      - "docs/Tests_Breadth_Elemental_Clearcasting_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-elemental:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source and all protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full profiles and actual completed spell costs
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_elemental_clearcasting_v0121_spec.lua" tests/Forever/aplforever_elemental_clearcasting_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_elemental_clearcasting_v0121_spec.lua
