name: Druid Balance v0.11 Moonkin Mana and final fallback
on:
  pull_request:
    paths:
      - ".github/workflows/druid-balance-v011-breadth.yml"
      - "experiments/native/aplforever_druid_balance_form_mana_v011_spec.lua"
      - "docs/Tests_Druid_Balance_Breadth_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
      - "roles/Druid/Current/APL_Druid_Balance_DPS_v1.0_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published source and protected repository hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap released native source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Exercise full default and Current Moonkin, form and Mana final fallbacks
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_druid_balance_form_mana_v011_spec.lua" tests/Forever/aplforever_druid_balance_form_mana_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_druid_balance_form_mana_v011_spec.lua
