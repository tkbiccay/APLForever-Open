name: "Breadth #26-27 Feral and MM actual source effects"
on:
  pull_request:
    paths:
      - ".github/workflows/feral-mm-effects-v011-breadth.yml"
      - "experiments/native/aplforever_feral_mm_effects_v011_spec.lua"
      - "roles/Druid/Current/APL_Druid_Feral_DPS_v1.0_Draft.txt"
      - "roles/Druid/Candidates/APL_Druid_Feral_v1.4_Draft.txt"
      - "roles/Hunter/Current/APL_Hunter_Marksmanship_DPS_v1.0_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_Marksmanship_v1.1_Draft.txt"
      - "docs/Tests_Breadth_Feral_MM_Effects_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source pin and immutable project APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap pinned released native Forever world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run full Feral and Marksmanship actual source effects
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_mm_effects_v011_spec.lua" tests/Forever/aplforever_feral_mm_effects_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_feral_mm_effects_v011_spec.lua
