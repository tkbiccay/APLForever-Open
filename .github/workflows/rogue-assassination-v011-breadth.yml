name: Rogue Assassination v0.11 native low-Energy opener transfer
on:
  pull_request:
    paths:
      - ".github/workflows/rogue-assassination-v011-breadth.yml"
      - "experiments/native/aplforever_rogue_assassination_energy_v011_spec.lua"
      - "docs/Tests_Rogue_Assassination_Breadth_v011.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published source and repository integrity
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published Forever native runtime
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test full Assassination low-Energy and guarded fallback
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_rogue_assassination_energy_v011_spec.lua" tests/Forever/aplforever_rogue_assassination_energy_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_rogue_assassination_energy_v011_spec.lua
