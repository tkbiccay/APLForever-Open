name: Hunter MM and Survival pet care v0.11 source experiment
on:
  pull_request:
    paths:
      - ".github/workflows/hunter-mmsv-v011-pet-experiment.yml"
      - "experiments/native/aplforever_hunter_mmsv_pet_v011_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunter-mmsv-pet-v011-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Pin and all source/candidate SHA checks
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap exact published Hekili engine
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full APL source-import and MM/SV pet-state plus combat comparison
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_hunter_mmsv_pet_v011_spec.lua" tests/Forever/aplforever_hunter_mmsv_pet_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_hunter_mmsv_pet_v011_spec.lua
