name: Feral v0.11 v1.4 defensive off-switch and source accepted actions
on:
  pull_request:
    paths:
      - ".github/workflows/feral-v011-v14-defensive-offswitch.yml"
      - "experiments/native/aplforever_feral_v14_defensive_offswitch_v011_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Validate source and protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published Forever Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test Feral v1.4 Barkskin source toggle and refusal boundaries
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_v14_defensive_offswitch_v011_spec.lua" tests/Forever/aplforever_feral_v14_defensive_offswitch_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_feral_v14_defensive_offswitch_v011_spec.lua
