name: Hunter BM v0.11 Lone Wolf standalone v1.4 APL
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v0110-lone-wolf-v14.yml"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.4_Draft.txt"
      - "experiments/native/aplforever_bm_lone_wolf_v14_spec.lua"
      - "experiments/native/aplforever_bm_lone_wolf_v14_combat_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm-lonewolf-v14-v011-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Check source pin and all 42 protected SHA APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Install published native test harness
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Full BM v1.4 pet client and regular combat accepted-cast comparisons
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_lone_wolf_v14_spec.lua" tests/Forever/aplforever_bm_lone_wolf_v14_spec.lua
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_lone_wolf_v14_combat_spec.lua" tests/Forever/aplforever_bm_lone_wolf_v14_combat_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_lone_wolf_v14_spec.lua tests/Forever/aplforever_bm_lone_wolf_v14_combat_spec.lua
