name: "Breadth #20-21 Shadow channel ticks and Affliction DoT v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/shadow-affliction-state-v011-breadth.yml"
      - "experiments/native/aplforever_shadow_channel_affliction_dot_v011_spec.lua"
      - "docs/Tests_Breadth_Shadow_Affliction_State_v011.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
      - "roles/Priest/Current/APL_Priest_Shadow_v1.0_Draft.txt"
      - "roles/Warlock/Current/APL_Warlock_Affliction_DPS_v1.0_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pinned published release and all immutable APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published native combat harness
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Execute actual Shadow channel and Affliction DoT state world checks
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_shadow_channel_affliction_dot_v011_spec.lua" tests/Forever/aplforever_shadow_channel_affliction_dot_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_shadow_channel_affliction_dot_v011_spec.lua
