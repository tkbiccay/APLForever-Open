name: "Breadth #31 Arms v0.12.1 unknown health Bloodrage guard"
on:
  pull_request:
    paths:
      - ".github/workflows/arms-health-v0121-breadth.yml"
      - "experiments/native/aplforever_arms_health_v0121_spec.lua"
      - "roles/Warrior/Current/APL_Warrior_Arms_DPS_v1.0_StaticValidated.txt"
      - "docs/Tests_Breadth_Arms_Health_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source and all protected revisions
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Compare full profiles with real health reader controls
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_arms_health_v0121_spec.lua" tests/Forever/aplforever_arms_health_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_arms_health_v0121_spec.lua
