name: Warlock Demonology v0.11 post-DoT Life Tap safety and fallback
on:
  pull_request:
    paths:
      - ".github/workflows/warlock-demo-v011-breadth.yml"
      - "experiments/native/aplforever_warlock_demonology_postdot_v011_spec.lua"
      - "docs/Tests_Warlock_Demonology_Breadth_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify pinned release and protected APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap exact published source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run actual press-chronology and Life Tap health-limited comparators
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_warlock_demonology_postdot_v011_spec.lua" tests/Forever/aplforever_warlock_demonology_postdot_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_warlock_demonology_postdot_v011_spec.lua
