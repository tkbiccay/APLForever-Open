name: BM v0.11 — pre-10 early unlock and fallback

on:
  pull_request:
    paths:
      - ".github/workflows/bm-v011-pre10-unlock.yml"
      - "experiments/native/aplforever_bm_pre10_unlock_v011_spec.lua"
      - "roles/Hunter/Current/APL_Hunter_BeastMastery_v1.1_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.4_Draft.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bm-level-one-nine:
    name: v0.11 BM level 1/4/6/9 at 4, 6, 12 yards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact project PR head
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout published Hekili Forever v0.11.0
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact release and protected APL integrity
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap published Lua source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test full shipped and both stored BM APLs under genuine level/rank/source states
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_pre10_unlock_v011_spec.lua" tests/Forever/aplforever_bm_pre10_unlock_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_bm_pre10_unlock_v011_spec.lua
