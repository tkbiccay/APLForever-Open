name: Feral v1.2 v0.10.0 focused source-native candidate

# Separate candidate gate: the historical selected Feral v1.0 has documented
# hidden-health errors and MUST NOT be silently substituted or approved.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/feral-v010-candidate.yml"
      - "roles/Druid/Candidates/APL_Druid_Feral_v1.2_Draft.txt"
      - "tests/native/aplforever_feral_defensives_v010_spec.lua"
      - "catalogue/**"

permissions:
  contents: read

jobs:
  feral-v12-v010:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APLFOREVER_SOURCE_RELEASE: v0.10.0
    steps:
      - name: Check out exact APLForever proposed changes
        uses: actions/checkout@v4
        with:
          path: aplforever
          persist-credentials: false
      - name: Check out released Forever v0.10.0
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 3c2cf3e32472cc807b1ba29d992fc13a273da8ee
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published release commit
        working-directory: upstream/hekili
        run: test "$(git rev-parse HEAD)" = "3c2cf3e32472cc807b1ba29d992fc13a273da8ee"
      - name: Verify immutable previous APLs and new SHA before native import
        working-directory: aplforever
        run: |
          python scripts/validate_repository.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_native_manifest import select_revision
          roles = json.loads(Path("catalogue/roles.json").read_text())["roles"]
          r = next(x for x in roles if x["apl_name"] == "Druid_Feral")
          assert r["latest_revision"] == "v1.2"
          assert r["preferred_apl"] == "roles/Druid/Current/APL_Druid_Feral_DPS_v1.0_Draft.txt"
          assert r["last_working_apl"] is None
          assert select_revision(r, "v0.10.0")["revision"] == "v1.0"
          assert len(r["revisions"]) == 3
          print("Feral v1.2 remains unselected, protected Current/Archive unchanged")
          PY
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/aplforever" >> "$GITHUB_ENV"
      - name: Bootstrap actual v0.10.0 Lua source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Feral candidate independent import, warning-negative and source-accepted progression
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/aplforever/tests/native/aplforever_feral_defensives_v010_spec.lua" tests/Forever/aplforever_feral_defensives_v010_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_feral_defensives_v010_spec.lua
