name: Feral v0.11 — source Energy/CP finisher + repeated tail
on:
  pull_request:
    paths:
      - ".github/workflows/feral-v011-combo-tail.yml"
      - "experiments/native/aplforever_feral_combo_tail_v011_spec.lua"
      - "roles/Druid/Archive/APL_Druid_Feral_DPS_v1.0_Draft.txt"
      - "roles/Druid/Archive/APL_Druid_Feral_v1.4_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feral-combo-tail:
    name: Natural source CP, Energy, finishers and repeated fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout protected public project PR
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout published Hekili Forever
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Assert source commit and protected APL SHA hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap source-native runtime
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run published-world actual press and final fallback coverage
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_combo_tail_v011_spec.lua" tests/Forever/aplforever_feral_combo_tail_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_feral_combo_tail_v011_spec.lua
