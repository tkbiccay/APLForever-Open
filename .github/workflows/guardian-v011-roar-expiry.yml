name: Guardian v0.11 — genuine 30s Roar expiry and repeated fallback
on:
  pull_request:
    paths:
      - ".github/workflows/guardian-v011-roar-expiry.yml"
      - "experiments/native/aplforever_guardian_roar_expiry_v011_spec.lua"
      - "roles/Druid/Current/APL_Druid_Guardian_Tank_v1.0_ReportedWorking.txt"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.5_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-roar-expiry:
    name: Exact v0.11 30-second source aura expiry, eligibility and fallback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public project PR
        uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - name: Checkout exact released Forever addon
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Pin source and verify immutable APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap source-native tests
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run 110-second Bear source model and expiry tests
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_guardian_roar_expiry_v011_spec.lua" tests/Forever/aplforever_guardian_roar_expiry_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_roar_expiry_v011_spec.lua
