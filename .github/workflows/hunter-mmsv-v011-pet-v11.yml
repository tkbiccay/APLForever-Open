name: Hunter MM Survival v0.11 full standalone pet recovery Drafts
on:
  pull_request:
    paths:
      - ".github/workflows/hunter-mmsv-v011-pet-v11.yml"
      - "experiments/native/aplforever_hunter_mmsv_pet_v11_full_spec.lua"
      - "roles/Hunter/Candidates/APL_Hunter_Marksmanship_v1.1_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_Survival_v1.1_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunter-mmsv-v11-v011-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Exact source pin and 44 full SHA-protected APLs
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published Hekili Forever native harness
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Matched complete MM/SV Current versus Draft client pet + true combat sources
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_hunter_mmsv_pet_v11_full_spec.lua" tests/Forever/aplforever_hunter_mmsv_pet_v11_full_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_hunter_mmsv_pet_v11_full_spec.lua
