name: Guardian v1.3 v0.10.0 focused Roar upkeep candidate

# Exact published source; this scope is NOT the red all-role v0.10.0 release gate
# and does not validate real group threat visibility, damage or tank survival.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/guardian-v010-roar.yml"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.3_Draft.txt"
      - "tests/native/aplforever_guardian_barkskin_v086_spec.lua"
      - "catalogue/**"

permissions:
  contents: read

jobs:
  guardian-roar-v010:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APLFOREVER_SOURCE_RELEASE: v0.10.0
    steps:
      - name: Check out exact public proposed changes
        uses: actions/checkout@v4
        with:
          path: aplforever
          persist-credentials: false

      - name: Check out exact published Hekili Forever v0.10.0 source
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 3c2cf3e32472cc807b1ba29d992fc13a273da8ee
          path: upstream/hekili
          persist-credentials: false

      - name: Verify published release SHA
        working-directory: upstream/hekili
        run: test "$(git rev-parse HEAD)" = "3c2cf3e32472cc807b1ba29d992fc13a273da8ee"

      - name: Verify full historical hashes and keep Guardian Current unchanged
        working-directory: aplforever
        run: |
          python scripts/validate_repository.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.build_native_manifest import select_revision
          data = json.loads(Path("catalogue/roles.json").read_text())
          r = next(row for row in data["roles"] if row["apl_name"] == "Druid_Guardian")
          assert r["latest_revision"] == "v1.3"
          assert len(r["revisions"]) == 4
          assert r["preferred_apl"] == r["last_working_apl"] == "roles/Druid/Current/APL_Druid_Guardian_Tank_v1.0_ReportedWorking.txt"
          assert select_revision(r, "v0.10.0")["revision"] == "v1.0"
          assert next(v for v in r["revisions"] if v["revision"] == "v1.3")["sha256"] == "200d7109ffcc345c41b05312a49b658b9a456a6f17fb56ea952f84d1d57079e0"
          print("Guardian v1.3 unselected, exact 4 revisions and working rollback preserved")
          PY
          python scripts/build_native_manifest.py --output "$RUNNER_TEMP/aplforever-native-manifest.lua" --source-release v0.10.0
          {
            echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/aplforever"
            echo "APLFOREVER_NATIVE_MANIFEST=$RUNNER_TEMP/aplforever-native-manifest.lua"
          } >> "$GITHUB_ENV"

      - name: Bootstrap published Hekili Forever source
        working-directory: upstream/hekili
        run: make bootstrap

      - name: Compare shipped, v1.0 rollback, v1.2 and v1.3 source-accepted Roar and Barkskin
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/aplforever/tests/native/aplforever_guardian_barkskin_v086_spec.lua" tests/Forever/aplforever_guardian_barkskin_v086_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_barkskin_v086_spec.lua
