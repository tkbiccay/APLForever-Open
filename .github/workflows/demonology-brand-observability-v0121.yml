name: "Breadth #43 Demonology Brand observability"
on:
  pull_request:
    paths:
      - ".github/workflows/demonology-brand-observability-v0121.yml"
      - "experiments/native/aplforever_demonology_brand_observability_v0121_spec.lua"
      - "roles/Warlock/Current/APL_Warlock_Demonology_DPS_v1.0_ReportedWorking.txt"
      - "docs/Tests_Breadth_Demonology_Brand_Observability_v0121.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-demonology:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: a4ca044512d7aacfdebca85cef617b1127115962
          path: upstream/hekili
          persist-credentials: false
      - name: Verify released source and DEMO-006 bytes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "a4ca044512d7aacfdebca85cef617b1127115962"
          python project/scripts/validate_repository.py
          echo "067ae757344a71f4a0d02f0a18e2f36745ceb8c0015761970948381aba8e7bf7  project/roles/Warlock/Current/APL_Warlock_Demonology_DPS_v1.0_ReportedWorking.txt" | sha256sum -c -
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Released Brand effect and controlled truth perturbation
        working-directory: upstream/hekili
        env:
          APLFOREVER_ROOT: ${{ github.workspace }}/project
        run: |
          cp "$APLFOREVER_ROOT/experiments/native/aplforever_demonology_brand_observability_v0121_spec.lua" tests/Forever/aplforever_demonology_brand_observability_v0121_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_demonology_brand_observability_v0121_spec.lua
