name: Feral v0.11 — original Cat rank unlock and first-three accepted
on:
  pull_request:
    paths:
      - ".github/workflows/feral-v011-level-boundaries.yml"
      - "experiments/native/aplforever_feral_level_boundaries_v011_spec.lua"
      - "roles/Druid/Current/APL_Druid_Feral_DPS_v1.0_Draft.txt"
      - "roles/Druid/Candidates/APL_Druid_Feral_v1.4_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  feral-level-boundaries:
    name: Exact released Feral Cat unlocks with complete profile imports
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify immutable Forever source and protected hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/project" >> "$GITHUB_ENV"
      - name: Bootstrap published source-native Lua
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Rank boundary and three real accepted follow-on actions
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_feral_level_boundaries_v011_spec.lua" tests/Forever/aplforever_feral_level_boundaries_v011_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_feral_level_boundaries_v011_spec.lua
