name: "Breadth #24-25 Frost FoF and Rogue Combo v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/frost-fof-rogue-combo-v011-breadth.yml"
      - "experiments/native/aplforever_frost_fof_rogue_combo_v011_spec.lua"
      - "roles/Mage/Current/APL_Mage_Frost_v1.0_Draft.txt"
      - "roles/Rogue/Current/APL_Rogue_Combat_v1.0_Draft.txt"
      - "roles/Rogue/Candidates/APL_Rogue_Combat_v1.1_Draft.txt"
      - "docs/Tests_Breadth_Frost_FoF_Rogue_Combo_v011.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source pin and immutable project APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap pinned released native Forever world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Run complete Frost and Rogue action-effect native suite
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_frost_fof_rogue_combo_v011_spec.lua" tests/Forever/aplforever_frost_fof_rogue_combo_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_frost_fof_rogue_combo_v011_spec.lua
