name: "Breadth #18-19 Rogue Ghostly Garrote + P0 Guardian Rage v0.11"
on:
  pull_request:
    paths:
      - ".github/workflows/subtlety-guardian-v011-breadth.yml"
      - "experiments/native/aplforever_subtlety_ghostly_guardian_rage_v011_spec.lua"
      - "docs/Tests_Breadth_Subtlety_Guardian_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
      - "roles/Rogue/Current/APL_Rogue_Subtlety_v1.0_Draft.txt"
      - "roles/Rogue/Candidates/APL_Rogue_Subtlety_v1.1_Draft.txt"
      - "catalogue/roles.json"
      - "Catalogue_All_Roles.md"
      - "roles/Druid/Current/APL_Druid_Guardian_Tank_v1.0_ReportedWorking.txt"
      - "roles/Druid/Candidates/APL_Druid_Guardian_v1.6_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact published source and all protected APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap published Forever source native runner
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Source actual Ghostly-Garrote and Guardian Maul world events
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_subtlety_ghostly_guardian_rage_v011_spec.lua" tests/Forever/aplforever_subtlety_ghostly_guardian_rage_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_subtlety_ghostly_guardian_rage_v011_spec.lua
