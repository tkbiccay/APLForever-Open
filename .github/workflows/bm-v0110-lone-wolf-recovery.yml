name: Hunter BM v0.11 source-native Lone Wolf pet recovery
on:
  pull_request:
    paths:
      - ".github/workflows/bm-v0110-lone-wolf-recovery.yml"
      - "experiments/native/aplforever_bm_lone_wolf_v011_spec.lua"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm-lone-wolf-v011-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify official pin, protected APLs and standalone rules
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap pinned published source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test BM Lone Wolf no-pet client state and repeated recommendations
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_lone_wolf_v011_spec.lua" tests/Forever/aplforever_bm_lone_wolf_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_lone_wolf_v011_spec.lua
