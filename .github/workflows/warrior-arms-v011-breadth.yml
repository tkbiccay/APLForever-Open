name: Warrior Arms v0.11 health compiler and full fallback
on:
  pull_request:
    paths:
      - ".github/workflows/warrior-arms-v011-breadth.yml"
      - "experiments/native/aplforever_warrior_arms_health_fallback_v011_spec.lua"
      - "roles/Warrior/Current/APL_Warrior_Arms_DPS_v1.0_StaticValidated.txt"
      - "roles/Warrior/Candidates/APL_Warrior_Arms_v1.1_Draft.txt"
      - "catalogue/roles.json"
      - "Catalogue_All_Roles.md"
      - "docs/Tests_Warrior_Arms_Breadth_v011.md"
      - "docs/knowledge/BREADTH_50_CAMPAIGN.md"
      - "docs/knowledge/ROLE_COVERAGE.md"
      - "docs/knowledge/CROSS_SPEC_LESSONS.md"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify published source and exact original rollback hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap v0.11 native world
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test complete shipped Current and unselected Arms source casts
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_warrior_arms_health_fallback_v011_spec.lua" tests/Forever/aplforever_warrior_arms_health_fallback_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_warrior_arms_health_fallback_v011_spec.lua
