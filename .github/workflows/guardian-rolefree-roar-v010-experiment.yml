name: Guardian v0.10.0 role-free Roar hypothesis (test only)

# Source-native side-by-side; never changes or approves an APL.
# Does not run unrelated 23-role compatibility or other candidate suites.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/guardian-rolefree-roar-v010-experiment.yml"
      - "experiments/native/aplforever_guardian_rolefree_roar_v010_spec.lua"
permissions:
  contents: read
concurrency:
  group: guardian-rolefree-v010-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  rolefree-source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact public Guardian candidate branch
        uses: actions/checkout@v4
        with:
          path: aplforever
          persist-credentials: false
      - name: Check out published Forever v0.10.0 source
        uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 3c2cf3e32472cc807b1ba29d992fc13a273da8ee
          path: upstream/hekili
          persist-credentials: false
      - name: Verify source pin and immutable previous APL hashes
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "3c2cf3e32472cc807b1ba29d992fc13a273da8ee"
          cd aplforever
          python scripts/validate_repository.py
          echo "APLFOREVER_ROOT=$GITHUB_WORKSPACE/aplforever" >> "$GITHUB_ENV"
      - name: Bootstrap current released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Test source-accepted normal-target/group and short/long solo Roar
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/aplforever/experiments/native/aplforever_guardian_rolefree_roar_v010_spec.lua" tests/Forever/aplforever_guardian_rolefree_roar_v010_spec.lua
          .lua/bin/busted --verbose tests/Forever/aplforever_guardian_rolefree_roar_v010_spec.lua
