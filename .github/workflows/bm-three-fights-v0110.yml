name: Hunter BM v0.11.0 three consecutive real source-world pulls
on:
  pull_request:
    paths:
      - ".github/workflows/bm-three-fights-v0110.yml"
      - "experiments/native/aplforever_bm_three_fights_v011_spec.lua"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.2_Draft.txt"
      - "roles/Hunter/Candidates/APL_Hunter_BeastMastery_v1.1_Draft.txt"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bm-v0110-three-fights-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify immutable v0.11.0 source and exact protected BM candidates
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap exact released Lua engine
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Actual source-accepted three-fight native comparisons, one addon boot
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_bm_three_fights_v011_spec.lua" tests/Forever/aplforever_bm_three_fights_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_bm_three_fights_v011_spec.lua
