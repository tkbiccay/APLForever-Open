name: Shaman Enhancement v0.11 native melee Mana and fallback
on:
  pull_request:
    paths:
      - ".github/workflows/shaman-enhancement-v011-breadth.yml"
      - "experiments/native/aplforever_shaman_enhancement_breadth_v011_spec.lua"
      - "docs/knowledge/CONTINUATION_HANDOVER.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: zmsl/hekili
          ref: 86b739cbc4e6afbcbc693c3790ee81197fc6234b
          path: upstream/hekili
          persist-credentials: false
      - name: Verify exact source and repository integrity
        run: |
          test "$(git -C upstream/hekili rev-parse HEAD)" = "86b739cbc4e6afbcbc693c3790ee81197fc6234b"
          python project/scripts/validate_repository.py
      - name: Bootstrap released source
        working-directory: upstream/hekili
        run: make bootstrap
      - name: Execute Enhancement full-profile combat and fallback
        working-directory: upstream/hekili
        run: |
          cp "$GITHUB_WORKSPACE/project/experiments/native/aplforever_shaman_enhancement_breadth_v011_spec.lua" tests/Forever/aplforever_shaman_enhancement_breadth_v011_spec.lua
          APLFOREVER_ROOT="$GITHUB_WORKSPACE/project" .lua/bin/busted --verbose tests/Forever/aplforever_shaman_enhancement_breadth_v011_spec.lua
